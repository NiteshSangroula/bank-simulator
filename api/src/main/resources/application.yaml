spring:
  application:
    name: FinanceTrackerAPI

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
      show-sql: true

logging:
  level:
    org.springframework.security: TRACE
